name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # Weekly rebuild so apt packages (cgit, git, apache2) pick up
  # Debian security updates even when the repo is idle.
  schedule:
    - cron: '17 4 * * 1'

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # Run the cgit-manage tests natively before the emulated image build,
      # so a broken name check fails the run in seconds instead of minutes.
      - name: Test cgit-manage
        run: cargo test --locked --manifest-path cgit-manage/Cargo.toml

      # arm64 builds run under QEMU emulation on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
