server.modules = (
  "mod_cgi",
  "mod_alias",
  "mod_setenv",
  "mod_rewrite",
)

# cgit.cgi lives here; serving it from the document root lets mod_cgi split the
# repo path into PATH_INFO, which cgit needs to route to a repo and its pages.
server.document-root = "/usr/lib/cgit"
server.port         = 80
server.bind         = "0.0.0.0"
server.errorlog     = "/dev/stderr"
server.breakagelog  = "/dev/stderr"
server.upload-dirs  = ( "/var/cache/lighttpd/uploads" )
server.pid-file     = "/run/lighttpd.pid"

mimetype.assign = (
  ".css"  => "text/css",
  ".png"  => "image/png",
  ".svg"  => "image/svg+xml",
  ".ico"  => "image/x-icon",
  ".html" => "text/html",
)

# Run *.cgi through mod_cgi. Covers cgit.cgi and the git-http-backend.cgi
# symlink the entrypoint creates.
cgi.assign = ( ".cgi" => "" )

# --- git smart HTTP (clone + push): /git/... -> git-http-backend ---
setenv.add-environment = (
  "GIT_PROJECT_ROOT" => "/srv/git",
  "GIT_HTTP_EXPORT_ALL" => "",
)
alias.url += ( "/git" => "/usr/lib/git-core/git-http-backend.cgi" )

# --- cgit static assets, served from their real locations ---
alias.url += ( "/cgit.css"    => "/usr/share/cgit/cgit.css" )
alias.url += ( "/cgit.png"    => "/usr/share/cgit/cgit.png" )
alias.url += ( "/favicon.ico" => "/usr/share/cgit/favicon.ico" )

# --- cgit web UI: rewrite every remaining path onto cgit.cgi so the repo and
# page selector arrive as PATH_INFO. Skip /git and the static assets above. ---
$HTTP["url"] !~ "^/(git(/|$)|cgit\.(css|png)|favicon\.ico)" {
  url.rewrite-once = ( "^/(.*)$" => "/cgit.cgi/$1" )
}
