# cgit web UI + git smart-HTTP (clone and anonymous push) from one URL space.
#
# cgit and git-http-backend share the same paths: a clone of
# http://git/<repo>.git and a browse of the same repo differ only in *which*
# sub-paths they touch. git's smart-HTTP client only ever asks for HEAD,
# info/refs, git-upload-pack, and git-receive-pack under the repo; cgit's browse
# UI never uses those names. So a path-suffix match cleanly routes clone/push to
# git-http-backend and everything else to cgit — no /git prefix needed.

ServerName git
ServerTokens Prod
ServerSignature Off
PidFile /run/apache2/apache2.pid
ErrorLog /dev/stderr
TransferLog /dev/stdout
LogLevel warn

Listen 80

# mod_unixd and mod_log_config are built into Debian's apache2 binary; only the
# rest ship as loadable .so files.
LoadModule mpm_event_module   /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module  /usr/lib/apache2/modules/mod_authz_core.so
LoadModule alias_module       /usr/lib/apache2/modules/mod_alias.so
LoadModule cgid_module        /usr/lib/apache2/modules/mod_cgid.so
LoadModule env_module         /usr/lib/apache2/modules/mod_env.so
LoadModule mime_module        /usr/lib/apache2/modules/mod_mime.so

# Apache refuses to run as root, so it serves as www-data. The entrypoint chowns
# the bare repos to www-data so git-http-backend can write objects on push.
User www-data
Group www-data

TypesConfig /etc/mime.types

# git-http-backend needs the repo root and export-all so it serves every bare
# repo under it without a per-repo git-daemon-export-ok marker.
SetEnv GIT_PROJECT_ROOT /srv/git
SetEnv GIT_HTTP_EXPORT_ALL 1

# --- git smart HTTP (clone + push) ---
# Route only the smart-HTTP endpoints to git-http-backend. The captured path
# after the script name becomes PATH_INFO, which the backend maps to the repo.
ScriptAliasMatch \
  "(?x)^/(.*/(HEAD|info/refs|objects/(info/[^/]+|[0-9a-f]{2}/[0-9a-f]{38}|pack/pack-[0-9a-f]{40}\.(pack|idx))|git-(upload|receive)-pack))$" \
  /usr/lib/git-core/git-http-backend/$1

# --- cgit static assets, served straight from disk (no CGI) ---
Alias /cgit.css    /usr/share/cgit/cgit.css
Alias /cgit.png    /usr/share/cgit/cgit.png
Alias /favicon.ico /usr/share/cgit/favicon.ico

# --- cgit web UI: everything else. cgit reads the repo + page from PATH_INFO. ---
ScriptAlias / /usr/lib/cgit/cgit.cgi/

<Directory /usr/lib/git-core>
  Options +ExecCGI
  Require all granted
</Directory>

<Directory /usr/lib/cgit>
  Options +ExecCGI
  Require all granted
</Directory>

<Directory /usr/share/cgit>
  Require all granted
</Directory>
